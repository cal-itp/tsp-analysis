[project]
name = "tsp_metrics_demos"
version = "0.1.0"
description = "Airflow DAGs and plugins for cal-itp-data-infra"
readme = "README.md"
requires-python = ">=3.11.6"
dependencies = [
    "geopandas (>=0.14.0, <0.15.0)",
    "pandas (>=2.0.0, <3.0.0)",
    "folium >= 0.12",
    "matplotlib == 3.10.7",
    "mapclassify == 2.10.0",
    "ipykernel>=7.1.0,<8.0.0",
    "numpy (>=1.26.4,<2.0.0)",
    "sqlalchemy",
    "sqlalchemy-bigquery",
    "google-cloud-bigquery-storage>=2.39.0",
    "pyarrow>=25.0.0",
    "google-cloud-secret-manager>=2.30.0",
]

[dependency-groups]
#dev = [
#    "ruff>=0.16.4",
#]
test = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-mock>=3.15.1,<4.0.0",
    "pytest-unordered>=0.7.0,<0.8.0",
    # the cassettes are parquet, not recorded HTTP, so the loaders' BigQuery SQL
    # is transpiled and run locally instead of replayed through pytest-recording
    "duckdb>=1.5.0,<2.0.0",
    "sqlglot>=27.0.0,<31.0.0",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
